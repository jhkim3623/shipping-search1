# ==========================================================
#  Streamlit 설정 파일
#  위치: 저장소 루트 > .streamlit > config.toml
# ==========================================================
#  주의: GitHub 웹 편집기에서 직접 수정하면 UTF-8 로 저장됩니다.
#        한글 Windows 메모장에 저장하지 마세요(글자가 깨질 수 있음).
# ==========================================================


[runner]
# [중요] 기본값은 true 입니다.
# false 로 두면 사용자의 조작(필터 적용, 탭 이동, 버튼 클릭)에 대한
# 반응이 느려집니다. 반드시 true 로 되돌리세요.
fastReruns = true


[server]
# 로컬 개발용 파일 감시 옵션입니다.
# Streamlit Cloud(배포 환경)에서는 실질적인 영향이 없으므로
# 그대로 두셔도 됩니다.
runOnSave = false

# 연결이 끊긴 세션의 상태를 정리하기까지 기다리는 시간(초).
# Streamlit 기본값은 120 입니다.
# 이 앱은 무료 한도(약 1GB)가 빠듯하므로 60 으로 줄여
# 남아 있는 세션 메모리를 조금 더 일찍 회수합니다.
# (화면이나 기능에는 영향이 없습니다)
disconnectedSessionTTL = 60


[browser]
# Streamlit 사용 통계 전송을 끕니다. (화면/성능 변화 없음)
gatherUsageStats = false
